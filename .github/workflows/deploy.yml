name: Deploy dashboard to GitHub Pages

# Every push to main republishes the site. This is what replaces the
# manual drag-and-drop to Netlify.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the dashboard before publishing
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          # Fail the build rather than publish a broken page.
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > /tmp/app.js && node --check /tmp/app.js
          node scripts/check.mjs
          echo "index.html present, its JavaScript parses and every company entry is complete."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
